name: 构建签名 APK 并发布到 GitHub Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-read-only: false

      # 仓库刻意不提交 gradle-wrapper.jar（二进制文件）：
      # setup-gradle 已把 Gradle 8.2 加入 PATH，无 wrapper 项目直接调用 gradle 即可。
      - name: 准备 Android SDK 34
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      # 私钥只以 base64 存放在 GitHub Secrets，CI 临时解码到 runner 临时目录
      - name: 还原签名密钥与签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_VALUE: ${{ secrets.KEY_ALIAS }}
          KEY_PWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/itemkeeper.jks"
          printf 'KEYSTORE_FILE=%s\nKEYSTORE_PASSWORD=%s\nKEY_ALIAS=%s\nKEY_PASSWORD=%s\n' \
            "$RUNNER_TEMP/itemkeeper.jks" "$KEYSTORE_PWD" "$KEY_ALIAS_VALUE" "$KEY_PWD" \
            > keystore.properties

      - name: 构建 Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 校验产物并命名
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::未找到已签名 APK，请检查四个签名 Secrets 是否配置完整"
            exit 1
          fi
          cp "$APK" "ItemKeeper.apk"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: 物志 ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            直接下载 APK 安装即可。覆盖升级请保持同一签名密钥。
            附件固定命名为 ItemKeeper.apk，latest 下载链接长期不变。
          files: ItemKeeper.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
